<!DOCTYPE html>
<html>
<body>
    <input id="input" type="text">
    <button onclick="enviar()">Mensajear</button>
    <div id="mensajes"></div>

    <script>
        // Detecta si la conexión es segura (https usa wss://, http usa ws://)
        const protocolo = window.location.protocol === 'https:' ? 'wss://' : 'ws://';

        // Obtiene el dominio actual automáticamente (ej. localhost:3000 o midominio.com)
        const host = window.location.host;

        // Crea la conexión dinámica
        const socket = new WebSocket(protocolo + host);

        socket.onopen = () => {
            console.log('El fascismo postmoderno es show que anestesia lo real');
            //socket.send('Cyberpunk');
        };


        socket.onmessage = (event) => {
            const mensaje = document.createElement('p');
            mensaje.textContent = "Alguien dijo: " + event.data;
            document.getElementById('mensajes').appendChild(mensaje);
        };

        function enviar() {
            const msg = document.getElementById('input').value;
            socket.send(msg); 
        }
    </script>
</body>
</html>
